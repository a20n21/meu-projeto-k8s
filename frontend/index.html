<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeopleFlow - Gestão de RH</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur h-16 flex items-center justify-between px-6">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold tracking-wider text-xs">P|F</div>
            <span class="font-semibold text-lg tracking-tight text-white">PeopleFlow RH</span>
        </div>
        <button id="btn-logout" class="hidden text-xs bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-400 px-3 py-1.5 rounded-lg font-medium transition">Sair</button>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow flex items-center justify-center w-full">
        
        <div id="view-login" class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-8 shadow-2xl max-w-sm w-full space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-bold text-white">Acesse o Portal</h2>
                <p class="text-xs text-slate-400">Use admin / matias123 para testar</p>
            </div>
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Usuário</label>
                    <input type="text" id="login-user" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
                    <input type="password" id="login-pass" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-2 rounded-lg transition shadow-lg shadow-indigo-600/20">Entrar</button>
            </form>
            <p id="login-erro" class="text-xs text-rose-400 text-center font-medium hidden">⚠️ Credenciais inválidas!</p>
        </div>

        <div id="view-dashboard" class="w-full space-y-8 hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-1 bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 space-y-4 h-fit">
                    <h3 class="text-base font-bold text-white">Novo Colaborador</h3>
                    <form id="form-cadastro" class="space-y-3">
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 mb-1">Nome Completo</label>
                            <input type="text" id="cad-nome" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 mb-1">Cargo</label>
                            <input type="text" id="cad-cargo" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 mb-1">Departamento</label>
                            <input type="text" id="cad-dept" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs py-2 rounded-lg transition">Adicionar</button>
                    </form>
                </div>

                <div class="md:col-span-2 bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-base font-bold text-white">Quadro de Colaboradores</h3>
                        <span id="contador-func" class="bg-indigo-500/10 text-indigo-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-indigo-500/20">0 Total</span>
                    </div>
                    <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-950/40">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-950 text-slate-400 font-medium border-b border-slate-800 text-[11px]">
                                <tr>
                                    <th class="p-3">Nome</th>
                                    <th class="p-3">Cargo</th>
                                    <th class="p-3">Departamentos</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-corpo">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-[10px] text-slate-500">
        &copy; 2026 PeopleFlow by Matias IT Consulting. Ambiente Kubernetes via Ingress.
    </footer>

    <script>
        const viewLogin = document.getElementById('view-login');
        const viewDashboard = document.getElementById('view-dashboard');
        const btnLogout = document.getElementById('btn-logout');
        
        // 1. Controle de Sessão no carregamento da página
        if (localStorage.getItem('userToken')) {
            exibirDashboard();
        }

        // 2. Evento de Login
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault();
            const usuario = document.getElementById('login-user').value;
            const senha = document.getElementById('login-pass').value;
            const erroEl = document.getElementById('login-erro');

            fetch('http://192.168.100.11:30080/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha })
            })
            .then(res => { if(!res.ok) throw new Error(); return res.json(); })
            .then(data => {
                if(data.success) {
                    localStorage.setItem('userToken', data.token);
                    erroEl.classList.add('hidden');
                    exibirDashboard();
                }
            })
            .catch(() => { erroEl.classList.remove('hidden'); });
        });

        // 3. Evento de Logout
        btnLogout.addEventListener('click', function() {
            localStorage.removeItem('userToken');
            viewDashboard.classList.add('hidden');
            btnLogout.classList.add('hidden');
            viewLogin.classList.remove('hidden');
        });

        // 4. Exibir o Painel e buscar dados
        function exibirDashboard() {
            viewLogin.classList.add('hidden');
            viewDashboard.classList.remove('hidden');
            btnLogout.classList.remove('hidden');
            carregarFuncionarios();
        }

        // 5. Buscar Funcionários no Backend
        function carregarFuncionarios() {
            fetch('http://192.168.100.11:30080/api/funcionarios')
            .then(res => res.json())
            .then(data => {
                document.getElementById('contador-func').innerText = `${data.length} Total`;
                const corpo = document.getElementById('tabela-corpo');
                corpo.innerHTML = data.map(f => `
                    <tr class="border-b border-slate-800/60 hover:bg-slate-800/20 transition">
                        <td class="p-3 font-medium text-white">${f.nome}</td>
                        <td class="p-3 text-slate-400">${f.cargo}</td>
                        <td class="p-3 text-indigo-400"><span class="bg-indigo-500/5 px-2 py-0.5 rounded border border-indigo-500/10">${f.departamento}</span></td>
                    </tr>
                `).join('');
            });
        }

        // 6. Evento de Cadastro de Novo Funcionário
        document.getElementById('form-cadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const cargo = document.getElementById('cad-cargo').value;
            const departamento = document.getElementById('cad-dept').value;

            fetch('http://192.168.100.11:30080/api/funcionarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, cargo, departamento })
            })
            .then(res => { if(!res.ok) throw new Error(); return res.json(); })
            .then(() => {
                document.getElementById('form-cadastro').reset();
                carregarFuncionarios(); // Atualiza a tabela na hora!
            });
        });
    </script>
</body>
</html>
