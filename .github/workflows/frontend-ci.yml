name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    runs-on: self-hosted

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Baixar o Kind Local na Pipeline
      run: |
        echo "Baixando o binário do Kind para a workspace do Runner..."
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
        chmod +x ./kind

    - name: Build, Injeção e Atualização do GitOps
      env:
        DOCKER_HOST: tcp://192.168.100.11:2375
      run: |
        # Gera tag curta baseada no SHA do commit
        TAG_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        
        echo "1. Fazendo o build remoto usando o Docker da VM do Kubernetes..."
        docker build -t meu-frontend:$TAG_SHA ./frontend
        
        echo "2. Injetando a imagem no Kind usando o Docker remoto..."
        ./kind load docker-image meu-frontend:$TAG_SHA --name k8s-local
        
        echo "3. Baixando o YQ para editar o YAML..."
        curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o ./yq && chmod +x ./yq
        
        echo "4. Atualizando a tag do frontend no values.yaml..."
        ./yq -i ".frontend.tag = \"$TAG_SHA\"" meu-app-chart/values.yaml
        
        echo "5. Comitando a nova tag de volta no repositório..."
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add meu-app-chart/values.yaml
        git commit -m "chore(gitops): atualizando tag do frontend para $TAG_SHA [skip ci]"
        git push origin ${{ github.ref_name }}