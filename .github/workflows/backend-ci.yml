name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**' 

jobs:
  build-backend:
    runs-on: self-hosted

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Build da Imagem Docker Backend
      run: |
        echo "Iniciando o build da imagem do backend..."
        docker build -t meu-backend:${{ github.sha }} ./backend
        docker tag meu-backend:${{ github.sha }} meu-backend:latest

    - name: Baixar e Configurar o Kind na Pipeline
      run: |
        echo "Baixando o binário oficial do Kind..."
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
        chmod +x ./kind

    - name: Injetar Imagem no Cluster Kind
      env:  
        DOCKER_HOST: unix:///var/run/docker.sock
      run: |
        echo "Enviando a nova imagem para dentro do nó do Kind..."
        ./kind load docker-image meu-backend:${{ github.sha }} --name k8s-local
        echo "Imagem do Backend injetada com sucesso!"