name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  build-backend:
    runs-on: self-hosted

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Baixar o Kind Local na Pipeline
      run: |
        echo "Baixando o binário do Kind para a workspace do Runner..."
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
        chmod +x ./kind

    - name: Build, Injeção e Deploy via Helm Containerizado
      env:
        # ATENÇÃO: Substitua pelo IP real da sua VM do Kubernetes
        DOCKER_HOST: tcp://192.168.100.11:2375
      run: |
        echo "1. Fazendo o build remoto usando o Docker da VM do Kubernetes..."
        docker build -t meu-backend:${{ github.sha }} ./backend
        
        echo "2. Injetando a imagem no Kind usando o Docker remoto..."
        ./kind load docker-image meu-backend:${{ github.sha }} --name k8s-local
        
        echo "3. Atualizando o Helm usando o volume local da VM do K8s..."
        docker run --rm \
          --network host \
          -v /home/k8s/.kube:/root/.kube \
          -v /home/k8s/meu-projeto-k8s:/apps \
          -w /apps \
          alpine/helm:3.12.0 \
          upgrade --install meu-app ./meu-app-chart --set backend.tag=${{ github.sha }} --reuse-values
          
        echo "Sucesso total no pipeline do Backend!"