name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**' 

jobs:
  build-backend:
    runs-on: self-hosted

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Build da Imagem Docker Backend
      run: |
        docker build -t meu-backend:${{ github.sha }} ./backend
        docker tag meu-backend:${{ github.sha }} meu-backend:latest

    - name: Injetar Imagem no Cluster Kind
      run: |
        /usr/local/bin/kind load docker-image meu-backend:${{ github.sha }} --name k8s-local