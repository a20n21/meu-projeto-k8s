name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  build-backend:
    runs-on: self-hosted

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Build da Imagem Docker Backend
      run: |
        echo "Iniciando o build da imagem do backend..."
        docker build -t meu-backend:${{ github.sha }} ./backend
        docker tag meu-backend:${{ github.sha }} meu-backend:latest

    - name: Injetar Imagem Direto no Nó do Kind via Docker
      run: |
        echo "Exportando imagem para TAR..."
        docker save meu-backend:${{ github.sha }} -o backend.tar
        
        echo "Copiando o TAR para dentro do container do Kind..."
        docker cp backend.tar k8s-local-control-plane:/backend.tar
        
        echo "Carregando a imagem no runtime do Kubernetes (containerd)..."
        docker exec k8s-local-control-plane ctr -n k8s.io images import /backend.tar
        
        echo "Limpando os arquivos temporários..."
        docker exec k8s-local-control-plane rm /backend.tar
        rm backend.tar
        echo "Imagem do Backend injetada com sucesso total!"