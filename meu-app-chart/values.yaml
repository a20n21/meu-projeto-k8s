backend:
  replicas: 1
  image: "meu-backend:local"
  containerPort: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

frontend:
  replicas: 1
  image: "meu-frontend:local"
  containerPort: 80
  nodePort: 30082
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"