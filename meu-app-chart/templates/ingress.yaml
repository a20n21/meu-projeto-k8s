apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meu-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - http:
      paths:
      # Regra 1: Tudo que começar com /api vai direto para o backend mantendo o caminho completo
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3000
      # Regra 2: A raiz e o resto do site vão para o frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
