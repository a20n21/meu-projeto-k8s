apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meu-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # MÁGICA DO REWRITE: Garante que o Ingress repasse o caminho correto para o Express
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      # Regra do Frontend (Raiz do site)
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      # Regra do Backend (Pega /api, /api/login, /api/funcionarios, etc.)
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 3000
